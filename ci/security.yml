name: security

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: pip install pip-audit packaging
      - name: Fail on a transformers version vulnerable to CVE-2026-4372
        run: python detection/audit_dependencies.py --requirements requirements-secure.txt
      - name: Full environment advisory cross-check
        run: pip-audit -r requirements-secure.txt --strict

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan repository configs (high severity fails the build)
        run: python detection/config_scanner.py --min-severity high .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest packaging
      - name: Run detection + defence unit tests
        run: pytest -q
